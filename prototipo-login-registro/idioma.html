
<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de idioma</title>

    <link rel="stylesheet" href="css/idioma.css">
    <script src="js/idioma.js" defer></script>
</head>

<body>
    <aside class="barra-lateral">
        <div class="logo">Menú</div>

        <nav class="navegacion">
            <a href="#" class="opcion">Menú</a>
            <a href="#" class="opcion activa">Chat</a>
            <a href="#" class="opcion">Configuración</a>
        </nav>

        <div class="controles-laterales">
            <label class="modo-oscuro">
                <span>modo oscuro</span>
                <input type="checkbox" id="interruptor-modo">
                <span class="interruptor"></span>
            </label>

            <button type="button" class="boton-salir">
                LOG OUT
            </button>
        </div>
    </aside>

    <main class="contenido">
        <h1>Idioma</h1>

        <section class="panel-idioma">
            <div class="idioma-actual" id="idioma-actual"
                 aria-live="polite">
                Idioma actual: Español (México)
            </div>

            <div class="selector-contenedor">
                <label for="selector-idioma" class="texto-oculto">
                    Seleccionar otro idioma
                </label>

                <select id="selector-idioma">
                    <option value="" disabled selected>otro idioma</option>
                    <option value="es-MX">🇲🇽 Español (México)</option>
                    <option value="zh-CN">🇨🇳 Chino (Simplificado)</option>
                    <option value="hi-IN">🇮🇳 Hindi</option>
                    <option value="en-GB">🇬🇧 Inglés (Reino Unido)</option>
                    <option value="ru-RU">🇷🇺 Ruso</option>
                    <option value="fr-FR">🇫🇷 Francés</option>
                </select>
            </div>
        </section>

        <section class="lista-idiomas" aria-label="Idiomas disponibles">
            <button class="tarjeta-idioma" type="button"
                    data-idioma="zh-CN" aria-label="Chino simplificado">
                <span class="bandera">🇨🇳</span>
            </button>

            <button class="tarjeta-idioma" type="button"
                    data-idioma="es-MX" aria-label="Español de México">
                <span class="bandera">🇲🇽</span>
            </button>

            <button class="tarjeta-idioma" type="button"
                    data-idioma="hi-IN" aria-label="Hindi">
                <span class="bandera">🇮🇳</span>
            </button>

            <button class="tarjeta-idioma" type="button"
                    data-idioma="en-GB" aria-label="Inglés británico">
                <span class="bandera">🇬🇧</span>
            </button>

            <button class="tarjeta-idioma" type="button"
                    data-idioma="ru-RU" aria-label="Ruso">
                <span class="bandera">🇷🇺</span>
            </button>

            <button class="tarjeta-idioma" type="button"
                    data-idioma="fr-FR" aria-label="Francés">
                <span class="bandera">🇫🇷</span>
            </button>
        </section>

        <div class="ilustracion" aria-hidden="true">
            <span>文</span>
            <span>A</span>
        </div>
    </main>
</body>
</html>
