<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="contenedor">

        <!-- Control para cambiar entre modos visuales -->
        <div class="control-modo">
            <button 
                type="button" 
                onclick="cambiarModo()" 
                id="boton-modo">
                👁
            </button>
        </div>

        <h1>INICIO DE SESIÓN</h1>

        <form>

            <label for="correo">
                Correo electrónico
            </label>

            <input 
                type="email" 
                id="correo" 
                name="correo"
                required
            >

            <label for="contrasena">
                Contraseña
            </label>

            <input 
                type="password" 
                id="contrasena" 
                name="contrasena"
                required
            >

            <p class="enlace">
                ¿No tienes una cuenta?
                <a href="registro.html">Crea una cuenta</a>
            </p>

            <button type="submit" class="boton-principal">
                INGRESAR
            </button>

        </form>

    </main>

    <script src="script.js"></script>

</body>

</html>
