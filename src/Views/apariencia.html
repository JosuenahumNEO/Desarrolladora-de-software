<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apariencia</title>
    <link rel="stylesheet" href="../../public/css/plantilla.css">
    <link rel="stylesheet" href="../../public/css/apariencia.css">
    <script src="/public/js/plantilla.js"></script>
</head>

<body>

    <!--header-->
    <header>
        <div class="left">
            <div class="menu-container">
                <div class="menu" id="menu">
                    <img src="/public/svg/keyframes.svg" alt="" id="keyframes2">
                </div>
            </div>
            <div class="brand">
                <img src="/public/svg/cube-hole.svg" alt="" class="logo">
                <span class="name"> PortDevs Solutions</span>
            </div>
        </div>

        <div class="right">
            <!--AQUI IRA FOTO DEL USUARIO NO ICO, luego cambiar-->
            <img src="/public/img/usuario.jpeg" alt="" class="user">
        </div>

    </header>

    <!--Sidebar-->
    <div class="sidebar" id="sidebar">
        <nav>
            <ul>
                <li>
                    <button class="btn-sidebar" data-accion="menu">
                        <img src="/public/svg/border-all-solid-full.svg" alt="">
                        <span class="texto">Menú</span>
                    </button>
                </li>
                <li>
                    <button class="btn-sidebar" data-accion="chat">
                        <img src="/public/svg/comment-dots-regular-full.svg" alt="">
                        <span class="texto">Chat</span>
                    </button>
                </li>
                <li>
                    <button class="btn-sidebar" data-accion="configuracion" aria-current="page">
                        <img src="/public/svg/gear-solid-full.svg" alt="">
                        <span class="texto">Configuración</span>
                    </button>
                </li>
                <li>
                    <!-- No lleva algun data-accion porque el JS la maneja aparte (para el modo oscuro) -->
                    <button class="btn-sidebar" id="item-modo" role="switch" aria-checked="false">
                        <img id="icono-modo" src="/public/svg/moon-sat.svg" alt="">
                        <span class="texto">Modo oscuro</span>
                        <span class="switch">
                            <span class="slider"></span>
                        </span>
                    </button>
                </li>

                <!--Logout-->
                <li class="down">
                    <button class="btn-sidebar red-jhon" data-accion="logout">
                        <img src="/public/svg/right-from-bracket-solid-full.svg" alt="">
                        <span class="texto">Cerrar Sesión</span>
                    </button>
                </li>
            </ul>
        </nav>
    </div>

    <main id="main">
        <p class="titulo-pagina">Apariencia</p>

        <p>Elige el estilo visual de tu sistema.</p>
        </header>

        <!-- MODOS DISPONIBLES -->
        <section class="opciones">

            <!-- MODO CLARO -->
            <article class="tarjeta seleccionada" data-modo="claro">

                <h2>Modo claro</h2>

                <button type="button" class="boton-modo" aria-pressed="true">

                    <span class="vista-previa tema-claro">

                        <span class="barra-superior">
                            <span class="circulo"></span>
                            <span class="linea logo-linea"></span>
                        </span>

                        <span class="panel-previo">

                            <span class="menu-previo">
                                <span></span>
                                <span></span>
                                <span></span>
                            </span>

                            <span class="contenido-previo">
                                <span class="linea larga"></span>
                                <span class="linea larga"></span>

                                <span class="fila">
                                    <span class="bloque"></span>
                                    <span class="bloque amarillo"></span>
                                </span>
                            </span>

                        </span>

                    </span>

                    <span class="texto-seleccion">
                        ✓ Modo claro seleccionado
                    </span>

                </button>

            </article>

            <!-- MODO OSCURO -->
            <article class="tarjeta" data-modo="oscuro">

                <h2>Modo oscuro</h2>

                <button type="button" class="boton-modo" aria-pressed="false">

                    <span class="vista-previa tema-oscuro">

                        <span class="barra-superior">
                            <span class="circulo"></span>
                            <span class="linea logo-linea"></span>
                        </span>

                        <span class="panel-previo">

                            <span class="menu-previo">
                                <span></span>
                                <span></span>
                                <span></span>
                            </span>

                            <span class="contenido-previo">
                                <span class="linea larga"></span>
                                <span class="linea larga"></span>

                                <span class="fila">
                                    <span class="bloque"></span>
                                    <span class="bloque amarillo"></span>
                                </span>
                            </span>

                        </span>

                    </span>

                    <span class="texto-seleccion">
                        Seleccionar modo oscuro
                    </span>

                </button>

            </article>

        </section>

        <!-- OTROS TEMAS -->
        <section class="seccion-otros">

            <h2>Otros temas</h2>

            <div class="muestra-temas">

                <div class="colores">
                    <span class="color rosa"></span>
                    <span class="color rojo"></span>
                    <span class="color amarillo"></span>
                </div>

                <div class="colores-secundarios">
                    <span class="color azul"></span>
                    <span class="color azul"></span>
                </div>

                <span class="color verde"></span>

            </div>

            <p>Más opciones visuales próximamente.</p>

        </section>



    </main>



</body>

</html>
