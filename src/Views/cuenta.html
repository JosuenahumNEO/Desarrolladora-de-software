<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de Cuenta</title>
  <link rel="icon" href="/public/img/usuario.jpeg" type="image/png">
  <link rel="stylesheet" href="/public/css/cuenta.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="nav-links">
        <button class="nav-btn">menu</button>
        <button class="nav-btn">chat</button>
        <button class="nav-btn">configuracion</button>
        
        <div class="dark-mode-toggle">
          <span>modo oscuro</span>
          <label class="switch">
            <input type="checkbox" id="toggleDarkMode">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <button class="logout-btn">FINALIZAR SESIÓN </button>
    </aside>

    <main class="main-content" id="vistaCuenta">
      <h2 class="section-title">Cuenta</h2>

      <div class="account-grid">
        <div class="form-section">
          <div class="form-row">
            <label for="inputNombre">nombre</label>
            <input type="text" id="inputNombre" value="josue nahum">
          </div>

          <div class="form-row">
            <label>correo</label>
            <span class="static-text" id="textoCorreo">correo@gmail.com</span>
          </div>

          <div class="form-row">
            <label>contraseña actual</label>
            <div class="password-display">
              <input type="password" id="mainPasswordInput" value="contraseña123" readonly>
              <button type="button" class="icon-btn" id="toggleMainPass" title="Mostrar/Ocultar">
                <img src="/public/img/ojo.png" alt="Mostrar contraseña" class="ico-sm" id="imgOjoMain">
              </button>
              <button type="button" class="btn-secondary" id="btnAbrirModalPass">cambiar contraseña</button>
            </div>
          </div>

          <div class="password-card hidden" id="modalPassword">
            <div class="form-row">
              <label>contraseña actual</label>
              <div class="input-with-icon">
                <input type="password" id="inputPassActual" value="contraseña123">
                <button type="button" class="icon-btn" id="toggleModalPass">
                  <img src="/public/img/ojo.png" alt="Mostrar contraseña" class="ico-sm" id="imgOjoModal">
                </button>
              </div>
            </div>

            <div class="form-row">
              <label>nueva contraseña</label>
              <input type="password" id="inputNuevaPass" placeholder="Escribe nueva contraseña">
            </div>

            <div class="validation-list">
              <p id="reqLength" class="invalid">8 caracteres</p>
              <p id="reqUpper" class="invalid">1 Mayúscula</p>
              <p id="reqLower" class="invalid">1 Minuscula</p>
            </div>

            <div class="card-actions">
              <button type="button" class="btn-cancel-light" id="btnDescartarPass">Descartar cambios</button>
              <button type="button" class="btn-confirm-green" id="btnConfirmarPass">Confirmar cambio</button>
            </div>
          </div>
        </div>

        <div class="profile-section">
          <div class="avatar-wrapper">
            <img src="/public/img/usuario.png" alt="Foto de perfil" id="imgPerfilActual">
            
            <button type="button" class="edit-avatar-btn" id="btnElegirImagen" title="Elegir imagen">
              <img src="/public/img/lapiz.png" alt="Editar" class="ico-sm">
            </button>
            
            <input type="file" id="fileInput" accept="image/*" hidden>
          </div>

          <img src="/public/img/usuario.png" alt="Silueta de usuario" class="bg-user-silhouette">
        </div>
      </div>

      <div class="bottom-actions">
        <button type="button" class="btn-danger" id="btnDescartarGeneral">Descartar</button>
        <button type="button" class="btn-success" id="btnGuardarGeneral">Guardar cambios</button>
      </div>
    </main>

    <section class="cropper-modal hidden" id="vistaAjustarFoto">
      <div class="cropper-container">
        <h2>Ajusta tu nueva foto de perfil</h2>

        <div class="crop-workspace" id="cropWorkspace">
          <img src="" alt="Previsualización" id="imgPreviewCrop" draggable="false">
          <div class="crop-circle-guide"></div>
        </div>
        <p class="crop-hint">Arrastra la imagen con el mouse para acomodarla dentro del círculo</p>

        <div class="cropper-actions">
          <button type="button" class="btn-danger-lg" id="btnCancelarFoto">Cancelar</button>
          <button type="button" class="btn-primary-lg" id="btnOtraImagen">Elegir otra imagen</button>
          <button type="button" class="btn-accept-lg" id="btnAceptarFoto">Aceptar</button>
        </div>
      </div>
    </section>
  </div>

  <script src="/public/js/cuenta.js"></script>
</body>
</html>
