
<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notificaciones</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="../../public/css/notificaciones.css">

    <!-- Archivo JavaScript -->
    <script src="../../public/js/notificaciones.js" defer></script>
</head>

<body>

    <main class="pagina-notificaciones">

        <section class="contenido-notificaciones"
            aria-labelledby="titulo-notificaciones">

            <h1 id="titulo-notificaciones">Notificaciones</h1>

            <p class="descripcion">
                Activa o desactiva las notificaciones según tus preferencias.
                Pasa el cursor sobre la opción para mostrar el interruptor.
            </p>

            <div class="lista-notificaciones">

                <div class="opcion-notificacion">

                    <span class="texto-notificacion">
                        Notificaciones
                    </span>

                    <label class="control-notificaciones">

                        <!-- Icono visible inicialmente -->
                        <svg class="icono-campana"
                            xmlns="http://www.w3.org/2000/svg"
                            width="28"
                            height="28"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true">

                            <path d="M18 8a6 6 0 0 0-12 0
                                c0 7-3 7-3 9h18c0-2-3-2-3-9"/>

                            <path d="M10 21h4"/>

                            <path d="M10 3a2 2 0 0 1 4 0"/>

                        </svg>

                        <!-- Interruptor funcional -->
                        <input
                            type="checkbox"
                            id="interruptor-notificaciones"
                            class="entrada-interruptor"
                            aria-label="Activar o desactivar notificaciones"
                            checked
                        >

                        <span class="interruptor-visual"
                            aria-hidden="true">

                            <span class="circulo-interruptor"></span>

                        </span>

                    </label>

                </div>

                <p class="estado-notificaciones"
                    id="estado-notificaciones"
                    aria-live="polite">
                    Notificaciones activadas
                </p>

            </div>

        </section>

    </main>

</body>
</html>
